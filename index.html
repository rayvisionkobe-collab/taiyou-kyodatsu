<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太陽の涙、虚脱の空</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1917">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Old+Mincho:wght@400;500&family=Shippori+Mincho+B1:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1917;--card:#231e1b;--text:#f5f1e8;--muted:#a8a29e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Old Mincho",serif}
header{height:38px;background:rgba(28,25,23,0.9);display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
header h1{font-family:"Shippori Mincho B1",serif;font-size:14px;letter-spacing:0.08em;margin:0}
.device{display:flex;gap:6px} .device button{font-size:11px;padding:4px 8px;border:1px solid #444;background:transparent;color:var(--text);border-radius:12px}
.device button.active{background:var(--text);color:var(--bg)}
.hero{width:100%;background:#0a0a0a;display:flex;justify-content:center;align-items:center;overflow:hidden}
.hero img{width:100%;height:auto;max-height:85vh;object-fit:contain;object-position:center}
@media(max-width:430px){.hero img{aspect-ratio:4/3;}}
.poem-wrap{max-width:768px;margin:0 auto;padding:24px 16px;background:rgba(28,25,23,0.78);backdrop-filter:blur(12px)}
.poem-card{padding:28px 20px;text-align:left}
.poem-main{font-family:"Yuji Syuku",cursive;font-size:26px;line-height:1.9;letter-spacing:0.04em;white-space:pre-wrap;text-align:left}
.poem-sub{margin-top:12px;font-size:13px;color:var(--muted);font-family:"Shippori Mincho B1",serif}
.practical{margin-top:16px;padding:10px 14px;background:#1e1e1e;border-radius:8px;color:var(--text);font-size:13px;line-height:1.5}
.controls{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.select{width:100%;padding:10px;background:#111;color:var(--text);border:1px solid #333;border-radius:8px;font-size:13px}
.toggle{display:flex;background:#111;border-radius:20px;padding:3px}
.toggle button{flex:1;padding:6px 12px;border-radius:16px;border:none;background:transparent;color:var(--muted);font-size:13px}
.toggle button.active{background:var(--text);color:var(--bg)}
.slider{width:100%}
.labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.real{max-width:768px;margin:0 auto;padding:16px}
.real-card{aspect-ratio:16/9;background:linear-gradient(180deg,#2a3a5a,#1c1917);border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}

/* シェアボタン */
.share-btn{width:100%;margin-top:14px;padding:11px;background:#f5f1e8;color:#1c1917;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.share-modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:flex-end;justify-content:center;z-index:50}
.share-modal.open{display:flex}
.share-sheet{width:100%;max-width:520px;background:#231e1b;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.share-tabs{display:flex;gap:6px;margin-bottom:12px}
.share-tabs button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid #444;background:transparent;color:#f5f1e8;font-size:12px}
.share-tabs button.active{background:#f5f1e8;color:#1c1917}
.share-preview{white-space:pre-wrap;background:#111;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;min-height:120px}
.share-actions{display:flex;gap:8px;margin-top:12px}
.share-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;cursor:pointer}
.copy-btn{background:#f5f1e8;color:#1c1917;font-weight:600}
.img-btn{background:#333;color:#f5f1e8}
.close-btn{background:transparent;color:#a8a29e;font-size:12px;margin-top:8px;width:100%;border:none;padding:8px}
.share-note{font-size:11px;color:#a8a29e;margin-top:8px;line-height:1.5}
footer{padding:24px;text-align:center;font-size:11px;color:var(--muted)}

/* v24: 詩をメインに */
.poem-main{font-size:26px !important;line-height:1.9 !important;text-align:left !important;}
@media(min-width:768px){
  .poem-main{font-size:34px !important;line-height:2.0 !important;}
  .poem-wrap{max-width:720px;margin:0 auto;}
  .real{max-width:520px;margin:0 auto;}  /* 画像は小さく */
  .real-card{aspect-ratio:16/9;}
}
@media(min-width:1024px){
  .poem-main{font-size:38px !important;}
  .real{max-width:480px;}
}
/* ③ 下の詩風と濃淡を小さく、目立たなく */
#bottomControls{opacity:0.75;transform:scale(0.92);transform-origin:top center;}
#bottomControls .toggle button{font-size:13px;padding:6px 10px;}
#bottomControls .slider{height:4px;}
#bottomControls .labels{font-size:11px;color:#a8a29e;}
</style>
</head>
<body>

<div class="hero"><img src="hero.jpg" alt="hero"></div>

  <div class="real-card" id="realCard">

  <div id="livePoemNote" style="font-size:11px;color:#a8a29e;margin-top:6px;display:none;">AIがライブ画像から自動生成した詩です。上の温墨イラストはトップのままです。</div>

  </div>

<footer>出典：ウェザーニュース / Myライブカメラ © rayvisionkobe-collab / PWA template v1 / 背景は生成り #1c1917 温墨</footer>

<script>

// 「。」で改行 + 左寄せ用 – 「。」の後で改行する (最後の「。」の後は改行しない)
function breakByMaru(text){
  if(!text) return text;
  // すでに改行がある場合は、それを残して、「。」でも改行
  return text.replace(/\n/g, '').replace(/。(?!$)/g, '。\n');
}
const LOCATIONS = [
  {id:"kobe", name:"神戸", lat:34.69, lon:135.19, weathernews_id:"7CDDE9067E16"},
  {id:"osaka", name:"大阪", lat:34.69, lon:135.50, weathernews_id:"7CDDE906F8CE"},
  {id:"sapporo", name:"札幌", lat:43.06, lon:141.35, weathernews_id:"410001361"},
  {id:"tokyo", name:"東京", lat:35.68, lon:139.76, weathernews_id:"410000116"},
  {id:"sendai", name:"仙台", lat:38.26, lon:140.87, weathernews_id:"7CDDE905CDB1"},
  {id:"nagoya", name:"名古屋", lat:35.18, lon:136.90, weathernews_id:"7CDDE906BBEF"},
  {id:"hiroshima", name:"広島", lat:34.39, lon:132.45, weathernews_id:"7CDDE908C8DC"},
  {id:"fukuoka", name:"福岡", lat:33.59, lon:130.40, weathernews_id:"7CDDE906F156"},
  {id:"naha", name:"那覇", lat:26.21, lon:127.68, weathernews_id:"7CDDE9086CB8"}
];
let liveData=null;
async function loadLive(){
  try{
    const res=await fetch('data.json?v='+Date.now(), {cache:'no-store'});
    if(res.ok) liveData=await res.json();
  }catch(e){ console.log('live skip', e); }
}
function getPoem(place, poet, level){
  const entry = liveData?.locations?.[place];
  if(entry?.poems?.[poet]?.[String(level)]) return entry.poems[poet][String(level)];
  if(entry?.poem){
    const lines = entry.poem.split('\n').filter(Boolean);
    if(level===0) return lines[0]||entry.poem;
    if(level===1) return lines.slice(0,2).join('\n');
    return lines.slice(0,3).join('\n');
  }
  const loc = LOCATIONS.find(l=>l.id===place);
  const name = loc?.name || place;
  const tpl = {
    kyodatsu: [`${name}の空は、今日も静かだ。`, `${name}の空は、今日も静かだ。\n風が、遠くで何かを運んでくる。`, `${name}の空は、今日も静かだ。\n風が、遠くで何かを運んでくる。\n曇りの午後、空だけが遠くへ行く。`, `${name}の空は、今日も静かだ。風が、遠くで何かを運んでくる。曇りの午後、どこへも行けず、空だけが遠くへ行ってしまうような、虚脱の午後だった。`],
    taiyou: [`${name}に、光が落ちている。`, `${name}に、光が落ちている。\n海の向こうで、風が渡ろうとしている。`, `${name}に、光が落ちている。\n海の向こうで、風が渡ろうとしている。\n晴れの光が、今日の空を包んでいる。`, `${name}に、光が落ちている。海の向こうで、風が渡ろうとしている。晴れの光が、樹々を照らし、すべての存在を光に包むような、太陽の涙の午後だった。`]
  };
  return tpl[poet][level]||tpl[poet][1];
}
async function fetchWeather(lat, lon){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
    const r = await fetch(url);
    const j = await r.json();
    const cur = j.current, day = j.daily;
    const wmap = {0:'晴',1:'晴',2:'曇',3:'曇',45:'霧',48:'霧',51:'小雨',53:'雨',55:'雨',61:'雨',63:'雨',65:'大雨',71:'雪',73:'雪',75:'大雪',80:'雨',95:'雷雨'};
    const w = wmap[cur.weather_code]||'曇';
    return `${w} ${Math.round(cur.temperature_2m)}℃ / ${Math.round(day.temperature_2m_min[0])}℃ 降水${cur.precipitation}mm 風${Math.round(cur.wind_speed_10m)}m`;
  }catch(e){ return '天気を取得中…'; }
}
async function updateAll(){
  const place = document.getElementById('placeSelect').value || 'kobe';
  const loc = LOCATIONS.find(l=>l.id===place) || LOCATIONS[0];
  const poet = document.querySelector('#poetToggle button.active')?.dataset.poet || 'kyodatsu';
  const level = parseInt(document.getElementById('level').value);
  const levels = ["からっと","ほどよく","こいめ","仙人級"];
  document.getElementById('poemMain').textContent = breakByMaru(getPoem(place, poet, level));
  const placeName = loc.name;
  const isAI = !!liveData?.locations?.[place]?.poems;
  document.getElementById('practical').textContent = '天気を取得中… ' + placeName;
  const w = await fetchWeather(loc.lat, loc.lon);
  document.getElementById('practical').textContent = w + ' ' + placeName;
    // 何時現在の天気か: data.json の updated_at から表示
    try{
      const wt = liveData?.updated_at || liveData?.locations?.[place]?.updated_at;
      if(wt){
        const d = new Date(wt);
        const mm = d.getMonth()+1, dd = d.getDate(), hh = String(d.getHours()).padStart(2,'0'), mi = String(d.getMinutes()).padStart(2,'0');
        document.getElementById('weatherTime').textContent = mm + '月' + dd + '日 ' + hh + ':' + mi + ' 現在の天気';
      } else {
        document.getElementById('weatherTime').textContent = '';
      }
    }catch(e){}
  const item = liveData?.locations?.[place];
  const img = document.getElementById('liveImg');
  const ph = document.getElementById('livePlaceholder');
  if(item && item.image && item.status !== 'no-image'){
    img.onerror = ()=>{ img.style.display='none'; if(ph){ ph.style.display='block'; ph.innerHTML='ライブ静止画を取得中…<br>次回の更新（1時間おき）で表示されます<br><span id="time"></span>'; } };
    img.src = item.image + '?v=' + Date.now();
    img.style.display='block';
    if(ph) ph.style.display='none';
  } else {
    if(img) img.style.display='none';
    if(ph){ ph.style.display='block'; ph.innerHTML='ライブ静止画を取得中…<br>この場所のライブがまだ取得できていません。次回の更新で表示されます<br><span id="time"></span>'; }
  }
  const upd = document.getElementById('liveUpdated');
  if(upd && item?.updated_at) upd.textContent = '・ ' + new Date(item.updated_at).toLocaleString('ja-JP');
  const t = document.getElementById('time'); if(t) t.textContent = new Date().toLocaleString('ja-JP');
}
function loadPrefs(){
  try{
    return {
      place: localStorage.getItem('kyodatsu_place') || 'kobe',
      poet: localStorage.getItem('kyodatsu_poet') || 'kyodatsu',
      level: localStorage.getItem('kyodatsu_level') || '1'
    };
  }catch(e){ return {place:'kobe', poet:'kyodatsu', level:'1'}; }
}
function savePrefs(){
  try{
    const place = document.getElementById('placeSelect').value;
    const poet = document.querySelector('#poetToggle button.active')?.dataset.poet || 'kyodatsu';
    const level = document.getElementById('level').value;
    localStorage.setItem('kyodatsu_place', place);
    localStorage.setItem('kyodatsu_poet', poet);
    localStorage.setItem('kyodatsu_level', level);
  }catch(e){}
}
function init(){
  const sel=document.getElementById('placeSelect');
  sel.innerHTML='';
  LOCATIONS.forEach(l=>{
    const o=document.createElement('option'); o.value=l.id; o.textContent=l.name; sel.appendChild(o);
  });
  // 保存されたデフォルトを復元
  const prefs = loadPrefs();
  sel.value = prefs.place;
  document.getElementById('level').value = prefs.level;
  document.querySelectorAll('#poetToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.poet === prefs.poet);
  });
  // Service Workerの古いキャッシュを消す
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs=>{
      regs.forEach(r=>r.unregister());
    });
    if('caches' in window){ caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))); }
  }
  loadLive().then(updateAll);
  // 30分おきに自動更新: ページを開きっぱなしでも、新しい静止画と詩を取りに行く
  // ユーザーの場所・詩風・濃淡は savePrefs で保存済みなので、更新しても変わらない
  setInterval(()=>{
    console.log('auto refresh 30min');
    loadLive().then(updateAll);
  }, 30*60*1000);
  // 5分おきに軽くチェック: data.json が新しくなっていたら、すぐ更新
  let lastUpdatedAt = null;
  setInterval(async ()=>{
    try{
      const r = await fetch('data.json?v='+Date.now(), {cache:'no-store'});
      if(!r.ok) return;
      const j = await r.json();
      if(lastUpdatedAt && j.updated_at === lastUpdatedAt) return;
      if(!lastUpdatedAt) lastUpdatedAt = liveData?.updated_at;
      if(j.updated_at !== lastUpdatedAt){ lastUpdatedAt = j.updated_at; liveData = j; updateAll(); }
    }catch(e){}
  }, 5*60*1000);
  // 5分おきに data.json の updated_at だけ軽くチェック (30分より早く気づくため)
  // 実際は30分ごとの更新に合わせるので、30分間隔で十分。5分チェックは入れない。
  // アプリに戻ってきたら、すぐ更新 (バックグラウンドから復帰)
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){
      console.log('back to foreground, refresh');
      loadLive().then(updateAll);
    }
  });
}
document.getElementById('placeSelect').addEventListener('change', ()=>{ savePrefs(); updateAll(); });
document.getElementById('level').addEventListener('input', ()=>{ savePrefs(); updateAll(); });
document.getElementById('poetToggle').addEventListener('click', e=>{
  if(e.target.tagName==='BUTTON'){
    document.querySelectorAll('#poetToggle button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active'); savePrefs(); updateAll();
  }
});
document.getElementById('sp').onclick=()=>{document.getElementById('poemWrap').style.maxWidth='390px';document.getElementById('sp').classList.add('active');document.getElementById('tab').classList.remove('active')};
document.getElementById('tab').onclick=()=>{document.getElementById('poemWrap').style.maxWidth='768px';document.getElementById('tab').classList.add('active');document.getElementById('sp').classList.remove('active')};

// ---- シェア ----
let shareTab = 'instagram';
const APP_URL = 'https://rayvisionkobe-collab.github.io/taiyou-kyodatsu/';
function getShareData(){
  const place = document.getElementById('placeSelect').value;
  const loc = LOCATIONS.find(l=>l.id===place);
  const poet = document.querySelector('#poetToggle button.active')?.dataset.poet || 'kyodatsu';
  const level = parseInt(document.getElementById('level').value || 1);
  const poemFull = document.getElementById('poemMain')?.textContent || '';
  const short = cutAt2Maru(poemFull); // SNSテキストも、画像と同じ「。」2つ。本体 (poemMain) は切らない
  const poetName = poet==='kyodatsu' ? '虚脱の空' : '太陽の涙';
  const placeName = loc?.name || place;
  return {place, placeName, poet, poetName, level, poemFull, short};
}
// SNS画像専用 – 「。」2つまでで切る (「、」は数えない。本体の詩は切らない)
function cutAt2Maru(text){
  const clean = (text||'').replace(/\n/g, '');
  let count = 0;
  for(let i=0; i<clean.length; i++){
    if(clean[i]==='。'){
      count++;
      if(count >= 2) return clean.slice(0, i+1);
    }
  }
  return clean;
}

}

// ---- 詩入り画像 ----
let _shareSize = 'insta'; // insta: 1080x1350, x: 1280x720
let _watercolor = true; // 軽い水彩 ON がデフォルト
async function renderPoemImage(){
  const d = getShareData();
  const imgEl = document.getElementById('liveImg');
  const wrap = document.getElementById('poemImgWrap');
  wrap.style.display = 'block';
  const canvas = document.getElementById('poemCanvas');
  const ctx = canvas.getContext('2d');
  const isVertical = _shareSize === 'insta';
  const cw = isVertical ? 1080 : 1280;
  const ch = isVertical ? 1350 : 720;
  canvas.width = cw; canvas.height = ch;
  // 背景: ライブ画像 – シェアだけ、1280px を試す (640だと、引き伸ばしてぼやける)
  try{
    const img = new Image(); img.crossOrigin = 'anonymous';
    let _src = imgEl?.src || 'hero.jpg';
    // weathernews は、/640/ の代わりに /1280/ があるので、シェアだけ高画質に
    if(_src.includes('/640/')) _src = _src.replace('/640/', '/1280/');
    img.src = _src;
    await new Promise((res, rej)=>{ img.onload=res; img.onerror=res; });
    const scale = Math.max(cw/img.width, ch/img.height);
    const w = img.width*scale, h = img.height*scale;
    // タッチを、天気・時間で変える – 1つのフィルターで、全部同じにしない
    const _hour = new Date().getHours();
    const _weatherTxt = (document.getElementById('practical')?.textContent || '');
    const _isSunset = (_hour >= 16 && _hour <= 19) || (_hour >= 5 && _hour <= 7);
    const _isNight = _hour >= 20 || _hour <= 4;
    const _isCloudy = _weatherTxt.includes('曇') || _weatherTxt.includes('雨');
    let _touch = 'bright'; // 晴・青空
    if(_isSunset) _touch = 'vivid'; // 朝焼け・夕焼け
    if(_isNight || _isCloudy) _touch = 'mono'; // 夜・曇り → モノクロ + 粒子で、わざと
    // 水彩 OFF なら、旧来の静かな背景 (比較用)
    if(!_watercolor){
      try{ ctx.filter = 'brightness(0.88) saturate(0.75) contrast(0.95) blur(2px)'; }catch(e){}
      ctx.drawImage(img, (cw-w)/2, (ch-h)/2, w, h);
      try{ ctx.filter = 'none'; }catch(e){}
    } else if(_touch === 'vivid'){
      // 朝焼け・夕焼け: 鮮やかに、ぼかし弱く – オレンジと青を、はっきり
      try{ ctx.filter = 'saturate(1.45) contrast(1.15) brightness(1.05) blur(1px)'; }catch(e){}
      ctx.drawImage(img, (cw-w)/2, (ch-h)/2, w, h);
      try{ ctx.filter = 'none'; }catch(e){}
    } else if(_touch === 'mono'){
      // 夜・曇り: モノクロ + 粒子 – グレーだから仕方なく、じゃなくて、わざとモノクロ
      try{ ctx.filter = 'grayscale(1) contrast(1.12) brightness(0.92) blur(1px)'; }catch(e){}
      ctx.drawImage(img, (cw-w)/2, (ch-h)/2, w, h);
      try{ ctx.filter = 'none'; }catch(e){}
      // フィルムの粒子
      try{
        const gr = document.createElement('canvas'); gr.width = 256; gr.height = 256;
        const gctx = gr.getContext('2d'); const id = gctx.createImageData(256,256);
        for(let i=0;i<id.data.length;i+=4){ const v = Math.random()*255; id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=10; }
        gctx.putImageData(id, 0, 0);
        const pat = ctx.createPattern(gr, 'repeat'); ctx.globalAlpha = 0.6; ctx.fillStyle = pat; ctx.fillRect(0,0,cw,ch); ctx.globalAlpha = 1;
      }catch(e){}
    } else {
      // 晴・青空: 明るく、青を残す
      try{ ctx.filter = 'saturate(1.25) brightness(1.08) contrast(1.05) blur(1px)'; }catch(e){}
      ctx.drawImage(img, (cw-w)/2, (ch-h)/2, w, h);
      try{ ctx.filter = 'none'; }catch(e){}
    }
    // 全体に、うっすら黒をかける – 詩が読める背景に
    const bg = ctx.createLinearGradient(0, 0, 0, ch);
    bg.addColorStop(0, 'rgba(0,0,0,0.28)');
    bg.addColorStop(0.5, 'rgba(0,0,0,0.10)');
    bg.addColorStop(1, 'rgba(0,0,0,0.30)');
    ctx.fillStyle = bg; ctx.fillRect(0,0,cw,ch);
    // 周りを、少し暗くして、詩を立たせる (ビネット)
    const vig = ctx.createRadialGradient(cw/2, ch/2, Math.min(cw,ch)*0.35, cw/2, ch/2, Math.max(cw,ch)*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = vig; ctx.fillRect(0,0,cw,ch);
  }catch(e){ ctx.fillStyle='#1c1917'; ctx.fillRect(0,0,1280,720); }
  // 薄い図形を透過で置くためのヘルパー (角丸)
  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  // 空の明るさを測る – 朝(明るい)と夜(暗い)で、箱の濃さを変える
  function getBrightness(x, y, w, h){
    try{
      const d = ctx.getImageData(Math.max(0, x|0), Math.max(0, y|0), Math.max(1, w|0), Math.max(1, h|0)).data;
      let sum = 0, n = 0;
      for(let i=0; i<d.length; i+=16){ sum += (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114); n++; }
      return n ? sum/n : 100;
    }catch(e){ return 100; }
  }
  function alphaForBrightness(b){
    // 明るいほど、濃く (朝: 0.35 / 昼: 0.22 / 夕: 0.12 / 夜: 0.06)
    if(b > 170) return 0.38;
    if(b > 130) return 0.25;
    if(b > 80) return 0.14;
    return 0.07;
  }
  // 詩 – 縦は大きく、横は今まで通り
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  const raw = cutAt2Maru(d.poemFull);
  // フレーズ改行: 「。」と「、」で切る – 11文字で割らない
  // 例: 「誰にも知られず、泣いた / 夜がある。」みたいに、言葉で切る
  const _poemFont = isVertical ? 48 : 40;
  const _lineH = isVertical ? 78 : 68;
  const _poemTop = isVertical ? 150 : 110;
  const _leftX = isVertical ? 90 : 110;
  const _maxChars = isVertical ? 11 : 12;
  const wrapped = [];
  {
    const noStart = new Set(['。','、','」','』','）','］','｝','〜','ー','…','・']);
    const noEnd = new Set(['「','『','（','［','｛','〈','《']);
    const sentences = raw.split('。').filter(s=>s.trim()!=='').map(s=>s+'。');
    sentences.forEach(sent=>{
      let cur = '';
      for(let i=0; i<sent.length; i++){
        const ch = sent[i];
        if(noEnd.has(ch) && cur.length >= 12){ wrapped.push(cur); cur = ch; continue; }
        cur += ch;
        if(ch === '。'){ wrapped.push(cur); cur = ''; continue; }
        if(cur.length >= _maxChars){
          // 禁則: 次が「。」や「、」なら、一緒にくっつける (「。」が次の行に1つだけ残らないように)
          while(i+1 < sent.length && noStart.has(sent[i+1])){
            i++; cur += sent[i];
            // 「。」が来たら、そこで文が終わるので、すぐ改行
            if(sent[i] === '。') break;
          }
          wrapped.push(cur); cur = '';
        }
      }
      if(cur) wrapped.push(cur);
    });
  }
  // フレーズ改行に、上書き – 長い文は「、」で分け、短い文はそのまま
  {
    const _phrases = [];
    raw.split('。').filter(s=>s.trim()!=='').forEach(sent=>{
      const s = sent + '。';
      // 「、」で分けて、14文字くらいまで、くっつける
      const parts = s.split('、');
      let cur = '';
      parts.forEach((p, idx)=>{
        const add = (idx===0? '' : '、') + p + (idx===parts.length-1? '' : '');
        // 最後の文は「。」が既に入ってるので、調整
        let piece = (idx===0? '' : '、') + p;
        if(idx===parts.length-1) piece += '。';
        if((cur + piece).length <= 14 || cur===''){ cur += piece; }
        else { _phrases.push(cur); cur = piece; }
      });
      if(cur) _phrases.push(cur);
    });
    // _phrases ができたら、wrapped を置き換える
    if(_phrases.length){ wrapped.length = 0; _phrases.forEach(p=>wrapped.push(p)); }
  }
  // 詩の下に、薄い図形 – 縦は大きく、横は今まで通り
  const leftX = _leftX + 55;
  const poemTop = _poemTop;
  const poemLineH = _lineH;
  const poemH = wrapped.length * poemLineH + 70;
  let maxLen = 0; wrapped.forEach(l=>{ if(l.length>maxLen) maxLen=l.length; });
  const poemW = Math.min(cw-140, maxLen * (_poemFont+2) + 110);
  const poemBright = getBrightness(leftX-55, poemTop-55, poemW, poemH);
  // 箱は、消す – 5枚の参考通り、文字に影だけで、写真の上に直接載せる
  // const poemAlpha = alphaForBrightness(poemBright);
  // roundRect(...); ctx.fill();
  // 詩を描く
  ctx.fillStyle = '#fff';
  ctx.font = '400 ' + _poemFont + 'px "Shippori Mincho B1", serif';
  try{ ctx.letterSpacing = '3px'; }catch(e){}
  // 文字に影 – 朝(明るい)は強く、夜(暗い)は弱く
  const poemShadow = poemBright > 130 ? 0.65 : 0.4;
  const poemBlur = poemBright > 130 ? 14 : 8;
  ctx.shadowColor = 'rgba(0,0,0,' + poemShadow + ')';
  ctx.shadowBlur = poemBlur;
  ctx.shadowOffsetY = 2;
  let y = poemTop + 26;
  wrapped.forEach(line=>{
    ctx.fillText(line, leftX, y); y += poemLineH;
  });
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  // 右下に、タイトルと天気 – 枠の中で中央寄せ・建物にかからないように、もう少し上に
  let weatherText = document.getElementById('practical')?.textContent?.trim() || '';
  weatherText = weatherText.split('\n')[0].trim();
  const titleText = '－太陽の涙、虚脱の空－';
  // practical に、すでに場所が入っているなら、場所を2回付けない (仙台 仙台 にならないように)
  const weatherLine = weatherText ? (weatherText.includes(d.placeName) ? weatherText : weatherText + ' ' + d.placeName) : d.placeName;
  // 枠のサイズ
  ctx.font = '400 22px "Shippori Mincho B1", serif'; // 28 → 22 小さく
  const titleW = ctx.measureText(titleText).width;
  ctx.font = '400 18px "Shippori Mincho B1", serif'; // 24 → 18 小さく
  const weatherW = ctx.measureText(weatherLine).width;
  const boxW = Math.max(titleW, weatherW) + 50;
  const boxH = 82;
  const boxX = cw - boxW - (isVertical ? 70 : 90);
  const boxY = isVertical ? ch - 220 : 470;
  const boxCenterX = boxX + boxW / 2;
  // 右下も、明るさで変える – 朝は濃く、夜は薄く (コンパクトはそのまま)
  const bottomBright = getBrightness(boxX, boxY, boxW, boxH);
  const bottomAlpha = alphaForBrightness(bottomBright);
  ctx.fillStyle = 'rgba(0,0,0,' + bottomAlpha + ')';
  roundRect(boxX, boxY, boxW, boxH, 16);
  ctx.fill();
  // タイトルと天気は、枠の中で中央寄せ – 字体も明朝で細く
  ctx.textAlign = 'center';
  try{ ctx.letterSpacing = '1px'; }catch(e){}
  ctx.shadowColor = bottomBright > 130 ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = bottomBright > 130 ? 10 : 5;
  ctx.shadowOffsetY = 1;
  ctx.font = '400 22px "Shippori Mincho B1", serif'; // 28 → 22
  ctx.fillStyle = '#fff';
  ctx.fillText(titleText, boxCenterX, boxY + 35);
  ctx.font = '400 18px "Shippori Mincho B1", serif';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillText(weatherLine, boxCenterX, boxY + 62);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  try{ ctx.letterSpacing = '0px'; }catch(e){}
  // 額縁は、やめる – 雰囲気を壊すので
  // アクセント線は、消す – マーカーみたいに見えるので
  ctx.textAlign = 'left';
}

name: Update Weather Still and Poem
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_poem:
        description: '詩を強制再生成 (1 で強制)'
        required: false
        default: ''
      force_slot:
        description: 'morning / noon / evening (空なら時間で決める)'
        required: false
        default: ''
      force_city:
        description: 'kobe だけ等 (空なら全部)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q requests Pillow
      - name: Fetch still and generate poem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_POEM: ${{ inputs.force_poem }}
          FORCE_SLOT: ${{ inputs.force_slot }}
          FORCE_CITY: ${{ inputs.force_city }}
        run: python fetch.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json images/ || true
          git diff --cached --quiet || git commit -m "auto update: still and poem"
          git push || echo "nothing to push"

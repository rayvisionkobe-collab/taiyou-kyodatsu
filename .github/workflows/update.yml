name: update weather + poems

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_poem:
        description: "1にすると今すぐ詩を作り直す (那覇だけ朝のままの時に使う)"
        required: false
        default: "0"

concurrency:
  group: update-weather
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - run: python fetch.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_POEM: ${{ github.event.inputs.force_poem || '0' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json images/
          git diff --cached --quiet || git commit -m "update"
          git push

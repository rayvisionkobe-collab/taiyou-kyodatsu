name: Generate Emergency Prompt

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate emergency prompts
        run: python generate_emergency_prompt.py
      - name: Commit
        run: |
          git config user.name "【entity-github¦canonical_name=GitHub】-actions[bot]"
          git config user.email "【entity-github¦canonical_name=GitHub】-actions[bot]@users.noreply.【entity-github¦canonical_name=GitHub】.com"
          git add emergency/
          git diff --cached --quiet || git commit -m "auto: emergency prompt"
          git push || echo "nothing to push"

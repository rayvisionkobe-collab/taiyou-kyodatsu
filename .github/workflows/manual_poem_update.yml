name: Manual Poem Update

on:
  workflow_dispatch:
    inputs:
      place:
        description: '場所 (例: kobe / tokyo / maiko / sapporo)'
        required: true
        default: 'kobe'
        type: choice
        options:
          - kobe
          - maiko
          - kobe_air
          - tokyo
          - sapporo
          - fukuoka
          - naha
          - fuji
      poem_text:
        description: 'Geminiの出力を、そのまま貼る (KYODATSU0: 〜 の形)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update poem from manual Gemini output
        run: |
          python manual_poem_update.py --place "${{ inputs.place }}" --poem-text "${{ inputs.poem_text }}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "manual: poem update ${{ inputs.place }}"
          git push

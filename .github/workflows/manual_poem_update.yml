name: Manual Poem Update

on:
  workflow_dispatch:
    inputs:
      place:
        description: '場所 (例: kobe / tokyo / maiko / sapporo)'
        required: true
        default: 'kobe'
        type: choice
        options:
          - kobe
          - maiko
          - kobe_air
          - tokyo
          - sapporo
          - fukuoka
          - naha
          - fuji
      poem_text:
        description: 'Geminiの出力を、そのまま貼る (KYODATSU0: 〜 TAIYOU0: 〜 の形) – 改行が潰れてもOK'
        required: false
        default: ''
        type: string
      kyodatsu0:
        description: 'KYODATSU0 だけ貼る場合 (1行) – poem_text と、どっちかでOK'
        required: false
        default: ''
        type: string
      kyodatsu1:
        description: 'KYODATSU1'
        required: false
        default: ''
        type: string
      kyodatsu2:
        description: 'KYODATSU2'
        required: false
        default: ''
        type: string
      kyodatsu3:
        description: 'KYODATSU3'
        required: false
        default: ''
        type: string
      taiyou0:
        description: 'TAIYOU0 (貼らなければ、元の太陽の詩は残ります)'
        required: false
        default: ''
        type: string
      taiyou1:
        description: 'TAIYOU1'
        required: false
        default: ''
        type: string
      taiyou2:
        description: 'TAIYOU2'
        required: false
        default: ''
        type: string
      taiyou3:
        description: 'TAIYOU3'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update poem from manual Gemini output
        run: |
          python manual_poem_update.py --place "${{ inputs.place }}" --poem-text "${{ inputs.poem_text }}" --kyodatsu0 "${{ inputs.kyodatsu0 }}" --kyodatsu1 "${{ inputs.kyodatsu1 }}" --kyodatsu2 "${{ inputs.kyodatsu2 }}" --kyodatsu3 "${{ inputs.kyodatsu3 }}" --taiyou0 "${{ inputs.taiyou0 }}" --taiyou1 "${{ inputs.taiyou1 }}" --taiyou2 "${{ inputs.taiyou2 }}" --taiyou3 "${{ inputs.taiyou3 }}"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "manual: poem update ${{ inputs.place }}"
          git push
